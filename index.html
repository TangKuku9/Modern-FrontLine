<head>
<meta charset="UTF-8">

<!-- 模块预载清单（性能审查 C8）：ESM 的按需发现是瀑布——main.js 解析完才知道下一层
     import，冷加载白付五六轮 RTT。这份清单由 test/preload-graph.mjs 从源码模块图推出
     （两个根：js/main.js 页面入口 + js/worker.mjs 常驻 Worker），加了新模块跑一遍判据，
     缺哪行它会打印出来。语义红线：预载不改缓存语义 —— 服务端仍然 no-cache + 304 回源，
     "发版本即同步"（云部署更新时旧缓存卡加载屏的那条账）一行不动。 -->

<body>
<div id="app"></div>

<!-- 加载 -->
<div id="loading" role="status" aria-live="polite" aria-label="加载中">
  <div class="load-inner">
    <div class="logo"><span class="l1">现代战线</span><span class="l2">MODERN FRONTLINE</span></div>
    <div class="load-bar"><div id="loadFill"></div></div>
    <div id="loadText">正在载入…</div>
    <!-- 加载失败时才亮（HUD 审计 HU-31）：那一屏原来只留下一行"初始化失败：xxx"，
         没有任何可点的东西 —— 能做的只有 F5，而屏幕上没告诉人可以这么干。 -->
    <button id="loadRetry" class="btn small" style="display:none">重试</button>
    <div class="load-tip">冲刺中按 C 滑铲</div>
  </div>
</div>

<!-- HUD -->
<!-- aria-live 只点在"事件到了才变"的那几格（据点失守、击杀条、字幕、网络读数），弹匣/备弹/血量
     数字/帧数那种每拍都在动的读数一律 aria-live="off"。理由：每拍变动的数被朗读器念出来等于念噪声，
     比不念更糟 —— 耳朵里全是噪声时，真正要通知的那一句反而听不见。装饰层（准星、小地图、受击方向、
     闪光/淡入淡出）整块 aria-hidden：它们没有文本可对，念出来只会添乱。 -->
<div id="hud" class="hidden" role="region" aria-label="游戏内信息面板">
  <div id="vignette" aria-hidden="true"></div>
  <div id="nvgFrame" class="hidden" aria-hidden="true"></div>
  <div id="scope" class="hidden" aria-hidden="true"><div class="scope-hole"></div><div class="scope-h"></div><div class="scope-v"></div><div class="scope-dot"></div></div>
  <div id="crosshair" aria-hidden="true"><i class="ct"></i><i class="cb"></i><i class="cl"></i><i class="cr"></i></div>
  <div id="hitmarker" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="dmgDirs" aria-hidden="true"></div>
  <div id="markers" aria-hidden="true"></div>
  <div id="compass" aria-hidden="true"><div id="compassStrip"></div><div class="compass-tick"></div></div>
  <div id="minimapWrap"><canvas id="minimap" width="220" height="220" aria-hidden="true"></canvas><div id="mmLabel" aria-hidden="true"></div><div id="teamAlive" aria-live="polite"></div></div>
  <div id="scorebar"></div>
  <div id="killfeed" aria-live="polite" aria-relevant="additions"></div>
  <!-- 对局内聊天（差距 43）：行在 .ct-log，输入行只在 chatOpen 时出现（Enter 全体 / Y 队伍） -->
  <div id="chatBox" class="hidden">
    <div id="chatLog" aria-live="polite" aria-relevant="additions"></div>
    <div id="chatIn"><span id="chatCh">全体</span><input id="chatSay" maxlength="120" autocomplete="off" spellcheck="false" aria-label="聊天输入"></div>
  </div>
  <div id="objective" aria-live="polite"></div>
  <div id="ammoBox">
    <div id="weaponName"></div>
    <div class="ammo-row"><span id="ammoMag" aria-live="off">30</span><span id="ammoRes" aria-live="off">/ 120</span></div>
    <div id="equipRow" aria-live="off"></div>
  </div>
  <div id="healthBox"><div id="healthFill"></div><div id="hpNum" aria-live="off"></div></div>
  <div id="streaks"></div>
  <div id="popups"></div>
  <div id="prompt" aria-live="polite"></div>
  <div id="progress"><div id="progressFill"></div></div>
  <div id="subtitles" aria-live="polite"></div>
  <div id="announce" role="alert"></div>
  <div id="enemyName"></div>
  <div id="alertEdge" aria-hidden="true"></div>
  <!-- 常驻网络读数（HU-08）：ping/回正/掉线状态以前只在按住 Tab 的记分板脚注里，
       被拽回时屏幕上一点解释都没有。文案由 NetClient.netStatus() 一处出，两端不各拼一遍。 -->
  <div id="netStat" aria-live="polite"></div>
  <div id="fps" aria-live="off"></div>
  <div id="flashOverlay" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>
</div>

<div id="deathScreen" class="hidden" role="status" aria-live="assertive">
  <div class="death-inner">
    <div class="death-title">你已阵亡</div>
    <div id="killerInfo"></div>
    <div id="respawnText"></div>
    <div id="spawnSelect"></div>
    <div class="death-btns"><button id="btnChangeClass" class="btn small">更换装备 [C]</button></div>
  </div>
</div>

<div id="scoreboard" class="hidden" role="region" aria-label="记分板" aria-live="off"></div>

<!-- 菜单层 -->
<div id="menu" role="region" aria-label="菜单"></div>

<!-- 掉锁之后"点一下接着打"那一层。它是真 <button>（HU-40）：以前是带 role="button" 的 div，
     那样键盘用户按 Enter/Space 什么都不会发生 —— 语义标签浏览器不会替你接事件。 -->
<button id="clickToPlay" class="hidden"><span>点击屏幕继续</span></button>

<script type="module" src="js/main.js"></script>
</body>
</html>
