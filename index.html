<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>现代战线 · MODERN FRONTLINE</title>
<!-- 内联 SVG：这个项目一个二进制资源都没有，不该为了标签页图标破例，也不该留一个 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141a12'/%3E%3Cpath d='M8 2.5v11M2.5 8h11' stroke='%23d4f24a' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/jsm/" } }
</script>
<!-- 模块预载清单（性能审查 C8）：ESM 的按需发现是瀑布——main.js 解析完才知道下一层
     import，冷加载白付五六轮 RTT。这份清单由 test/preload-graph.mjs 从源码模块图推出
     （两个根：js/main.js 页面入口 + js/worker.mjs 常驻 Worker），加了新模块跑一遍判据，
     缺哪行它会打印出来。语义红线：预载不改缓存语义 —— 服务端仍然 no-cache + 304 回源，
     "发版本即同步"（云部署更新时旧缓存卡加载屏的那条账）一行不动。 -->
<link rel="modulepreload" href="js/account.js">
<link rel="modulepreload" href="js/ai.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/campaign.js">

<link rel="modulepreload" href="js/textures.js">

<link rel="modulepreload" href="js/viewmodel.js">

<body>
<div id="app"></div>

<!-- 加载 -->
<div id="loading">
  <div class="load-inner">
    <div class="logo"><span class="l1">现代战线</span><span class="l2">MODERN FRONTLINE</span></div>
    <div class="load-bar"><div id="loadFill"></div></div>
    <div id="loadText">正在载入…</div>
    <div class="load-tip">冲刺中按 C 滑铲</div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="vignette"></div>
  <div id="nvgFrame" class="hidden"></div>
  <div id="scope" class="hidden"><div class="scope-hole"></div><div class="scope-h"></div><div class="scope-v"></div><div class="scope-dot"></div></div>
  <div id="crosshair"><i class="ct"></i><i class="cb"></i><i class="cl"></i><i class="cr"></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div id="dmgDirs"></div>
  <div id="markers"></div>
  <div id="compass"><div id="compassStrip"></div><div class="compass-tick"></div></div>
  <div id="minimapWrap"><canvas id="minimap" width="220" height="220"></canvas><div id="mmLabel"></div></div>
  <div id="scorebar"></div>
  <div id="killfeed"></div>
  <!-- 对局内聊天（差距 43）：行在 .ct-log，输入行只在 chatOpen 时出现（Enter 全体 / Y 队伍） -->
  <div id="chatBox" class="hidden">
    <div id="chatLog"></div>
    <div id="chatIn"><span id="chatCh">全体</span><input id="chatSay" maxlength="120" autocomplete="off" spellcheck="false"></div>
  </div>
  <div id="objective"></div>
  <div id="ammoBox">
    <div id="weaponName"></div>
    <div class="ammo-row"><span id="ammoMag">30</span><span id="ammoRes">/ 120</span></div>
    <div id="equipRow"></div>
  </div>
  <div id="healthBox"><div id="healthFill"></div></div>
  <div id="streaks"></div>
  <div id="popups"></div>
  <div id="prompt"></div>
  <div id="progress"><div id="progressFill"></div></div>
  <div id="subtitles"></div>
  <div id="announce"></div>
  <div id="enemyName"></div>
  <div id="alertEdge"></div>
  <div id="fps"></div>
  <div id="flashOverlay"></div>
  <div id="fade"></div>
</div>

<div id="deathScreen" class="hidden">
  <div class="death-inner">
    <div class="death-title">你已阵亡</div>
    <div id="killerInfo"></div>
    <div id="respawnText"></div>
    <div id="spawnSelect"></div>
    <div class="death-btns"><button id="btnChangeClass" class="btn small">更换装备 [C]</button></div>
  </div>
</div>

<div id="scoreboard" class="hidden"></div>

<!-- 菜单层 -->
<div id="menu"></div>

<div id="clickToPlay" class="hidden"><div>点击屏幕继续</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
